name: MoonGram Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/moongram-miniapp-admin
    paths:
      - 'TMessagesProj/**'
      - 'TMessagesProj_App/**'
      - 'TMessagesProj_AppStandalone/**'
      - 'TMessagesProj_Modules/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/moongram-android-apk.yml'

permissions:
  contents: read

concurrency:
  group: moongram-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check Android build prerequisites
        run: |
          test -f TMessagesProj/google-services.json || { echo "::error::TMessagesProj/google-services.json is missing."; exit 1; }
          test -f TMessagesProj_App/google-services.json || { echo "::error::TMessagesProj_App/google-services.json is missing."; exit 1; }
          test -f TMessagesProj/config/release.keystore || { echo "::error::Android signing keystore is missing."; exit 1; }
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("TMessagesProj_App/google-services.json").read_text())
          packages = {
              client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for client in config.get("client", [])
          }
          expected = "org.telegram.messenger.beta"
          if expected not in packages:
              raise SystemExit(f"Firebase config has no client for debug package {expected}")
          print("Firebase debug package configuration: OK")
          print("Android signing keystore: present")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK command-line tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android SDK Manager not found at $SDKMANAGER"
            find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "ANDROID SDK Manager: $SDKMANAGER"

      - name: Install Android build tools
        run: |
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Validate private Telegram API credentials
        env:
          MOONGRAM_API_ID: ${{ secrets.MOONGRAM_API_ID }}
          MOONGRAM_API_HASH: ${{ secrets.MOONGRAM_API_HASH }}
        run: |
          if [ -z "$MOONGRAM_API_ID" ] || [ -z "$MOONGRAM_API_HASH" ]; then
            echo "::error::Add MOONGRAM_API_ID and MOONGRAM_API_HASH in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi
          if ! [[ "$MOONGRAM_API_ID" =~ ^[1-9][0-9]*$ ]] || ! [[ "$MOONGRAM_API_HASH" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "::error::Telegram API ID/hash format is invalid."
            exit 1
          fi

      - name: Build MoonGram debug APK
        env:
          MOONGRAM_API_ID: ${{ secrets.MOONGRAM_API_ID }}
          MOONGRAM_API_HASH: ${{ secrets.MOONGRAM_API_HASH }}
        run: |
          chmod +x ./gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoonGram-debug-APK
          path: TMessagesProj_App/build/outputs/apk/afat/debug/app.apk
          if-no-files-found: error
          retention-days: 14
# Re-trigger Android APK build after repository secrets were configured.
